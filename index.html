<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Weather App</h1>

    <form id="city-form">
      <input type="text" id="city-input" placeholder="Enter a city" required>
      <button type="submit">Search</button>
    </form>

    <p id="message"></p>

    <div class="card">
      <h2 id="city-name">--</h2>
      <p class="temp"><span id="temp">--</span>°C</p>

      <div class="stats">
        <div class="stat">
          <p class="label">Humidity</p>
          <p class="value"><span id="humidity">--</span>%</p>
        </div>
        <div class="stat">
          <p class="label">Wind</p>
          <p class="value"><span id="wind">--</span> km/h</p>
        </div>
      </div>
    </div>

    <p class="hint">Type a city name and press Enter. If red text appears, check the spelling.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
